name: deploy-cloudrun (optional)

# Manual run only, for those who have a Google Cloud project.
# Needs: repository variables GCP_PROJECT_ID and GCP_REGION,
#        secret GCP_CREDENTIALS (service account key JSON).
# Takes an image the pipeline already tested and published to GHCR,
# copies it to Artifact Registry (Cloud Run cannot pull from GHCR) and deploys it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCR image tag to deploy, e.g. sha-1a2b3c4 or latest"
        default: latest
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Copy the tested image from GHCR to Artifact Registry
        id: image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "Bad tag: $TAG"; exit 1;; esac
          src="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          dst="$REGION-docker.pkg.dev/$PROJECT/calc/calc:$TAG"
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$src"
          gcloud artifacts repositories describe calc --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 \
            || gcloud artifacts repositories create calc --repository-format=docker --location="$REGION" --project="$PROJECT"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker tag "$src" "$dst"
          docker push "$dst"
          echo "image=$dst" >> "$GITHUB_OUTPUT"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: calc
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.image }}
          flags: --allow-unauthenticated

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl -fsS "$URL/healthz"
          echo
          echo "Service URL: $URL" >> "$GITHUB_STEP_SUMMARY"
