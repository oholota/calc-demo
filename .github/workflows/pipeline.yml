name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:

# The token gets only what the jobs need.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag:
      # a tag can be moved to malicious code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest tests/unit

      - name: Build the image
        run: docker build -t calc:ci .

      - name: Start the app container
        run: docker run -d --name calc -p 8000:8000 calc:ci

      - name: Wait until the container is healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' calc)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          exit 1

      - name: HTTP tests against the container
        run: pytest tests/http --base-url http://127.0.0.1:8000

      - name: App logs
        if: always()
        run: docker logs calc
