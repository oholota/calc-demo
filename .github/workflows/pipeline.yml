name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:

# The token gets only what the jobs need.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag:
      # a tag can be moved to malicious code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # the last change, for the AI explanation

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # Output goes to files too: the AI step reads them if something fails.
      # pipefail keeps the step red when pytest fails behind "| tee".
      - name: Unit tests
        run: |
          set -o pipefail
          pytest tests/unit 2>&1 | tee test-output.log

      - name: Build the image
        run: |
          set -o pipefail
          docker build --progress=plain -t calc:ci \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            . 2>&1 | tee build.log

      - name: Start the app container
        run: docker run -d --name calc -p 8000:8000 calc:ci

      - name: Wait until the container is healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' calc)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          exit 1

      - name: HTTP tests against the container
        run: |
          set -o pipefail
          pytest tests/http --base-url http://127.0.0.1:8000 2>&1 | tee -a test-output.log

      - name: App logs
        if: always()
        run: docker logs calc

      # Runs only when a step above failed. Advisory: it never fails the job.
      - name: "AI: explain the failure"
        if: failure()
        env:
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_VERSION: ${{ vars.AI_API_VERSION }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          docker logs calc > app.log 2>&1 || true
          git diff HEAD~1 > change.diff || true
          python tools/ai_assist.py explain build.log test-output.log app.log change.diff

      # Build once, ship what was tested: the publish job pushes this exact image (main only).
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save calc:ci | gzip > calc-image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: calc-image
          path: calc-image.tar.gz
          retention-days: 1

  ai-summary:
    name: AI summary
    # Pull requests from this repository only: forks get no secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: "AI: summarize the pull request"
        env:
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_VERSION: ${{ vars.AI_API_VERSION }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The checked-out commit is "PR merged into base": its first parent is the base.
          git diff HEAD^1 HEAD > pr.diff
          python3 tools/ai_assist.py summarize pr.diff --out summary.md
          if [ -s summary.md ]; then gh pr comment "$PR_NUMBER" --body-file summary.md; fi

  publish:
    name: Publish
    needs: test
    # Only main ships: other branches and pull requests are tested, not published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calc-image

      - name: Load the tested image
        run: gunzip -c calc-image.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          docker tag calc:ci "$image:$tag"
          docker tag calc:ci "$image:latest"
          docker push "$image:$tag"
          docker push "$image:latest"
          # A digest never changes, unlike a tag: deploy by digest.
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $image:$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A throwaway Kubernetes cluster inside the runner. A real target
      # (AKS, EKS, GKE) differs only in how kubectl gets its credentials.
      - name: Create a Kubernetes cluster (kind)
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: demo

      - name: Create secrets in the cluster
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$TOKEN"
          kubectl create secret generic calc \
            --from-literal=secret-key="$(openssl rand -hex 32)"

      - name: Deploy the published image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          sed "s|IMAGE_FROM_PIPELINE|$IMAGE|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/calc --timeout=180s

      - name: Smoke test
        run: |
          kubectl port-forward service/calc 8080:80 >/dev/null 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          answer=$(curl -fsS -X POST http://127.0.0.1:8080/api/calc \
            -H "Content-Type: application/json" -d '{"expression": "6*7"}')
          echo "$answer"
          echo "$answer" | grep -q '"result": 42'

      - name: What is running
        if: always()
        run: |
          kubectl get deployments,replicasets,pods,services -o wide
          kubectl describe deployment calc | tail -n 20
