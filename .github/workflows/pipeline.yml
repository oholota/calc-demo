name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:

# The token gets only what the jobs need.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag:
      # a tag can be moved to malicious code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest tests/unit

      - name: Build the image
        run: |
          docker build -t calc:ci \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

      - name: Start the app container
        run: docker run -d --name calc -p 8000:8000 calc:ci

      - name: Wait until the container is healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' calc)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          exit 1

      - name: HTTP tests against the container
        run: pytest tests/http --base-url http://127.0.0.1:8000

      - name: App logs
        if: always()
        run: docker logs calc

      # Build once, ship what was tested: the publish job pushes this exact image (main only).
      - name: Save the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save calc:ci | gzip > calc-image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: calc-image
          path: calc-image.tar.gz
          retention-days: 1

  publish:
    name: Publish
    needs: test
    # Only main ships: other branches and pull requests are tested, not published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: calc-image

      - name: Load the tested image
        run: gunzip -c calc-image.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          docker tag calc:ci "$image:$tag"
          docker tag calc:ci "$image:latest"
          docker push "$image:$tag"
          docker push "$image:latest"
          # A digest never changes, unlike a tag: deploy by digest.
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $image:$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
