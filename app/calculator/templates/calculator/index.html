{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calc</title>
  <link rel="stylesheet" href="{% static 'calculator/calc.css' %}">
</head>
<body>
  <main class="calc">
    <output id="display" class="display" aria-live="polite">0</output>
    <div class="keys">
      <button data-key="C" class="fn">C</button>
      <button data-key="(" class="fn">(</button>
      <button data-key=")" class="fn">)</button>
      <button data-key="/" class="op">&divide;</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="*" class="op">&times;</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="-" class="op">&minus;</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="+" class="op">+</button>
      <button data-key="0" class="wide">0</button>
      <button data-key=".">.</button>
      <button data-key="=" class="eq">=</button>
    </div>
  </main>
  <footer>{{ footer }}</footer>
  <script src="{% static 'calculator/calc.js' %}"></script>
</body>
</html>
